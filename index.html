<script type="text/babel" src="app.jsx"></script>

<script>
  // BudouX: insert <wbr> at natural Japanese phrase boundaries in
  // free-flowing body text. Skip display headings — they use manual
  // nowrap chunks (.under-strong, .st-line, .tt-line, inline white-space)
  // that <wbr> would override, producing breaks mid-phrase.
  // React renders via Babel after DOMContentLoaded, so we wait for the
  // first heading to appear before applying.
  (function initBudouX() {
    if (typeof BudouXJa === 'undefined') return setTimeout(initBudouX, 60);
    var parser = BudouXJa.loadDefaultJapaneseParser();
    var selector = '.lede, .essence-quote, .cc-text, .midcta-sub, .hps-text, .hob-text, .rb-text, .hero-lede';
    function apply() {
      document.querySelectorAll(selector).forEach(function (el) {
        if (el.dataset.budoux === '1') return;
        parser.applyToElement(el);
        el.dataset.budoux = '1';
      });
    }
    var root = document.getElementById('root');
    if (root && root.querySelector('.lede, .essence-quote')) { apply(); return; }
    if (!root) return;
    var obs = new MutationObserver(function () {
      if (root.querySelector('.lede, .essence-quote')) { apply(); obs.disconnect(); }
    });
    obs.observe(root, { childList: true, subtree: true });
  })();
</script>
</body>
